<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Загрузка приложения</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a472a 0%, #0d2818 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 40px;
            padding: 50px 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            color: #1a472a;
            font-size: 28px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .progress-container {
            background: #e0e0e0;
            border-radius: 30px;
            height: 12px;
            margin: 30px 0;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #2e7d32, #4caf50);
            width: 0%;
            height: 100%;
            border-radius: 30px;
            transition: width 0.1s linear;
            animation: loading 5s linear forwards;
        }

        @keyframes loading {
            from { width: 0%; }
            to { width: 100%; }
        }

        .status {
            font-size: 14px;
            color: #888;
            margin-top: 10px;
        }

        .android-badge {
            display: inline-block;
            background: #3ddc84;
            color: #1a1a1a;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 20px;
        }

        .error-box {
            background: #ffebee;
            border-left: 4px solid #f44336;
            padding: 20px;
            border-radius: 16px;
            margin-top: 20px;
        }

        .error-box h3 {
            color: #c62828;
            margin-bottom: 8px;
        }

        .error-box p {
            color: #555;
            font-size: 14px;
        }

        .retry-btn {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s, background 0.2s;
        }

        .retry-btn:hover {
            background: #1b5e20;
            transform: scale(1.02);
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div class="icon">📱</div>
        <h1>Подождите секунду...</h1>
        <div class="subtitle">Пожалуйста, не закрывайте страницу</div>
        
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        <div class="status" id="statusText">Подготовка к загрузке...</div>
        
        <div id="androidInfo" style="margin-top: 15px;"></div>
    </div>

    <script>
        function isAndroid() {
            return /Android/i.test(navigator.userAgent);
        }

        const statusText = document.getElementById('statusText');
        const androidInfo = document.getElementById('androidInfo');

        if (isAndroid()) {
            androidInfo.innerHTML = '<span class="android-badge">🤖 ANDROID ОБНАРУЖЕН</span>';
            statusText.textContent = 'Файл APK готовится к скачиванию...';
            
            setTimeout(function() {
                statusText.textContent = 'Начинаем загрузку...';
                setTimeout(function() {
                    window.location.href = "https://grigorylushov.github.io/tb/1.2/happybirthday.apk";
                }, 500);
            }, 4500);
        } else {
            androidInfo.innerHTML = '';
            document.querySelector('.icon').textContent = '⚠️';
            document.querySelector('h1').textContent = 'Устройство не поддерживается';
            document.querySelector('.subtitle').innerHTML = 'Данное приложение доступно <strong>только для Android</strong>';
            statusText.textContent = 'Загрузка отменена';
            
            const container = document.querySelector('.container');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-box';
            errorDiv.innerHTML = `
                <h3>❌ Ошибка совместимости</h3>
                <p>Это приложение предназначено исключительно для устройств на платформе Android.<br>
                Пожалуйста, откройте эту страницу с Android-телефона или планшета.</p>
            `;
            container.appendChild(errorDiv);
            
            const retryBtn = document.createElement('button');
            retryBtn.className = 'retry-btn';
            retryBtn.innerHTML = '🔄 Проверить снова';
            retryBtn.onclick = () => location.reload();
            container.appendChild(retryBtn);
            
            document.querySelector('.progress-container').style.display = 'none';
            
            const footer = document.createElement('div');
            footer.className = 'footer';
            footer.innerHTML = '© 2024 • Только для Android';
            container.appendChild(footer);
        }
    </script>
</body>
</html>
